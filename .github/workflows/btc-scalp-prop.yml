name: BTC Scalp Proporcional (Bot 5, 15min)

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos (respaldo — poco confiable en GitHub, ver cron-job.org)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scalp-prop-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Correr bot scalp proporcional (Bot 5)
        run: python btc_scalp_prop_bot.py

      - name: Guardar log en repositorio
        run: |
          git config --global user.email "btc-scalp-prop-bot@github"
          git config --global user.name "BTC Scalp Prop Bot"

          LOG=btc_scalp_prop_log.jsonl
          BOOK=btc_scalp_prop_book.jsonl   # profundidad del libro en cada apuesta (solo existe tras la primera apuesta)

          # Misma estrategia anti-conflictos que btc-scalp.yml: capturar SOLO
          # las líneas nuevas de este ciclo y reaplicarlas sobre la base más
          # reciente en cada intento (ver ese workflow para el porqué).
          #
          # Diferencia: "git diff" no ve archivos que todavía no existen en el
          # repo, así que en el PRIMER ciclo (archivo aún sin trackear) habría
          # dicho "sin cambios" y la línea se perdía en silencio. Si el
          # archivo no está trackeado, se toma su contenido completo.
          capturar() {
            if git ls-files --error-unmatch "$1" >/dev/null 2>&1; then
              git diff -- "$1" | grep '^+' | grep -v '^+++' | sed 's/^+//' || true
            else
              cat "$1" 2>/dev/null || true
            fi
          }
          NEW_LOG=$(capturar "$LOG")
          NEW_BOOK=$(capturar "$BOOK")

          if [ -z "$NEW_LOG" ] && [ -z "$NEW_BOOK" ]; then
            echo "Sin cambios en los logs, nada que commitear."
            exit 0
          fi

          reaplicar() {
            # $1 = archivo, $2 = contenido nuevo.
            # "reset --hard" no borra archivos sin trackear: si el archivo aún
            # no existe en el repo, hay que quitar la copia local o las líneas
            # nuevas se duplicarían al reaplicarlas.
            git ls-files --error-unmatch "$1" >/dev/null 2>&1 || rm -f "$1"
            if [ -n "$2" ]; then
              printf '%s\n' "$2" >> "$1"
              git add "$1"
            fi
          }

          pushed=0
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            reaplicar "$LOG" "$NEW_LOG"
            reaplicar "$BOOK" "$NEW_BOOK"
            git commit -m "Scalp Prop cycle $(date '+%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "Push rechazado (intento $i), reintentando..."
            sleep $((RANDOM % 5 + 1))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::No se pudo pushear $LOG tras 8 intentos"
            exit 1
          fi
