name: BTC Scalp Proporcional (Bot 5, 15min)

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos (respaldo — poco confiable en GitHub, ver cron-job.org)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scalp-prop-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Correr bot scalp proporcional (Bot 5)
        run: python btc_scalp_prop_bot.py

      - name: Guardar log en repositorio
        run: |
          git config --global user.email "btc-scalp-prop-bot@github"
          git config --global user.name "BTC Scalp Prop Bot"

          LOG=btc_scalp_prop_log.jsonl

          # Misma estrategia anti-conflictos que btc-scalp.yml: capturar SOLO
          # la línea nueva de este ciclo y reaplicarla sobre la base más
          # reciente en cada intento (ver ese workflow para el porqué).
          #
          # Diferencia: "git diff" no ve archivos que todavía no existen en el
          # repo, así que en el PRIMER ciclo (log aún sin trackear) habría
          # dicho "sin cambios" y la apuesta se perdía en silencio. Si el
          # archivo no está trackeado, se toma su contenido completo.
          if git ls-files --error-unmatch "$LOG" >/dev/null 2>&1; then
            NEW_CONTENT=$(git diff -- "$LOG" | grep '^+' | grep -v '^+++' | sed 's/^+//')
          else
            NEW_CONTENT=$(cat "$LOG" 2>/dev/null || true)
          fi

          if [ -z "$NEW_CONTENT" ]; then
            echo "Sin cambios en el log, nada que commitear."
            exit 0
          fi

          pushed=0
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            # "reset --hard" no borra archivos sin trackear: si el log aún no
            # existe en el repo, hay que quitar la copia local o la línea
            # nueva se duplicaría al reaplicarla.
            git ls-files --error-unmatch "$LOG" >/dev/null 2>&1 || rm -f "$LOG"
            printf '%s\n' "$NEW_CONTENT" >> "$LOG"
            git add "$LOG"
            git commit -m "Scalp Prop cycle $(date '+%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "Push rechazado (intento $i), reintentando..."
            sleep $((RANDOM % 5 + 1))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::No se pudo pushear $LOG tras 8 intentos"
            exit 1
          fi
