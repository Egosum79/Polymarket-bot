name: Esports Bot

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-esports-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run esports bot
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          API_PASSPHRASE: ${{ secrets.API_PASSPHRASE }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PANDASCORE_API_KEY: ${{ secrets.PANDASCORE_API_KEY }}
        run: python esports_bot.py

      - name: Commit and push log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add esports_bot_log.jsonl
          if git diff --cached --quiet; then
            echo "Sin cambios en el log, nada que commitear."
            exit 0
          fi
          for i in 1 2 3 4 5; do
            git commit -m "esports_bot: log ciclo $(date -u +%Y-%m-%dT%H:%M:%SZ)" && \
            git fetch origin && \
            git rebase origin/main && \
            git push origin HEAD:main && break
            echo "Intento $i fallo, reintentando..."
            sleep 5
            if [ "$i" = "5" ]; then
              echo "Fallaron los 5 intentos de push."
              exit 1
            fi
          done
